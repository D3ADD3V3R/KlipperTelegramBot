# Anyone who can execute G-Code (including uploaded files) can invoke this macro.
# Do NOT enable on installations accepting untrusted G-Code.
[gcode_macro TELEGRAM_PAIRING_CREATE]
description: Create one temporary Telegram subscriber pairing code
gcode:
    {action_call_remote_method("klipper_telegram_pairing_create")}

[gcode_macro TELEGRAM_STATUS]
description: Show Telegram bot connection and subscriber count
gcode:
    {action_call_remote_method("klipper_telegram_status")}
