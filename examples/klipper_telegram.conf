# This config remains local and must never be committed with credentials.
[general]
printer_name: Ender 3

[moonraker]
url: http://127.0.0.1:7125
# Optional if local trusted-client access is unavailable:
api_key:

[telegram]
# Token is stored in a separate chmod 600 file.
token_file: ~/printer_data/config/klipper_telegram.token

[pairing]
expiration_seconds: 600
max_attempts: 5

[on_printing]
enabled: true
message: 🖨️ {printer}: Druck gestartet — {filename}

[on_paused]
enabled: true
message: ⏸️ {printer}: Druck pausiert — {filename}

[on_complete]
enabled: true
message: ✅ {printer}: Druck abgeschlossen — {filename}

[on_cancelled]
enabled: true
message: 🚫 {printer}: Druck abgebrochen — {filename}

[on_error]
enabled: true
message: ❌ {printer}: Druckfehler — {filename}

# Console messages, not Telegram broadcasts:
[on_pairing_created]
enabled: true
console_message: Telegram Pairing Code: {code}; bot @{bot}

[on_pairing_success]
enabled: true
console_message: Connected to Telegram-User {user}

[on_pairing_expired]
enabled: true
console_message: Telegram Pairing Code expired

[telegram_commands]
auto_register: true
use_subscriber_scopes: true

[image]
enabled: true
default_camera: PrinterCam
# nginx reverse proxy for relative /webcam/?action=snapshot URLs
proxy_base: http://127.0.0.1
timeout: 10
max_image_size_mb: 8
# Comma-separated additional explicitly trusted camera hosts (default: loopback only).
allowed_hosts:
caption: 📷 {printer} - {camera_name}
# For image attachments to hooks, add to [on_complete], etc.:
# include_image: true
# camera: PrinterCam
